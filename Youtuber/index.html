*{box-sizing:border-box}body{margin:0;background:#f5f3ff;color:#25233b;font-family:system-ui,'KaiTi','Kaiti SC',sans-serif}header{background:#453582;color:white;padding:32px 5vw}h1{margin:0 0 10px;font-size:clamp(25px,4vw,38px)}header p{margin:6px 0;line-height:1.7}.layout{max-width:1400px;margin:auto;padding:24px;display:grid;grid-template-columns:1.15fr 1fr;gap:24px}section,.paper{background:white;border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 5px 22px #3029500a}section{border-top:7px solid var(--color)}h2{margin:0 0 18px;font-size:23px}label{display:block;font-size:20px;line-height:1.8;margin-top:15px}input,textarea,select{font:inherit;border:2px solid #d7d1e5;border-radius:10px;background:#fff;padding:10px;width:100%;color:#25233b}textarea{min-height:76px;resize:vertical}input:focus,textarea:focus,select:focus{outline:3px solid #dacbff;border-color:#7358be}.row{display:flex;align-items:center;gap:8px}.row label{flex:1}.listen{flex-shrink:0}button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#eee8fa;color:#382665}button:hover{background:#ded2f5}button:focus-visible{outline:3px solid #f2b12c}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.primary{background:#6343a4;color:white}.primary:hover{background:#4b3081}.paper{position:sticky;top:20px;align-self:start;border-top:7px solid #ecac38}#essay{white-space:pre-wrap;line-height:2;font-family:'KaiTi','Kaiti SC',serif;font-size:23px}small,.note{color:#656078;font-size:14px;line-height:1.7}#status{min-height:24px;color:#594195}fieldset{border:0;padding:0;margin:0}.hidden{display:none}#progress{font-size:15px;background:#ffffff20;display:inline-block;padding:6px 12px;border-radius:20px}footer{text-align:center;padding:10px 20px 30px;color:#656078}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:14px}.paper{position:static}section,.paper{padding:18px}}@media print{header,.form,.actions,.note,#status,footer{display:none!important}.layout{display:block;padding:0}.paper{box-shadow:none;border:0;padding:20px}#essay{font-size:20px}body{background:white}}

</style><header><h1>🎬 我最喜欢的 YouTuber</h1><p>Fill in the boxes. Your answers become an essay! 点击 🔊 听句子。</p><div class="actions supports"><label><input type="checkbox" id="showEnglish"> English</label><label><input type="checkbox" id="showPinyin"> 拼音 Pinyin</label></div><span id="progress"></span></header><main class="layout"><div class="form" id="form"></div><article class="paper"><h2>📝 我的作文</h2><div class="actions"><button class="primary" id="readAll">🔊 Read my essay</button><button id="stop">■ Stop</button><button id="copy">Copy essay</button><button id="download">Download text</button><button id="print">Print</button><button class="primary" id="submitForm">Submit essay</button></div><div class="actions"><label style="font-size:15px;margin:0">Reading speed <select id="speed"><option value="0.7">Slow 慢速</option><option value="0.9">Normal 正常</option></select></label></div><p class="note">Audio uses your device’s Mandarin voice. A Chinese voice may need to be enabled in your device settings. Your answers are saved in this browser when available.</p><div id="status" role="status" aria-live="polite"></div><div id="essay"></div><div class="actions"><button id="clear">Clear all answers</button></div></article></main><footer>写一写 · 听一听 · 说一说</footer>
<script>
const guides={
name:['Dàjiā hǎo! Wǒ jiào ____。','Hello, everyone! My name is ____.'],
creator:['Wǒ zuì xǐhuān de YouTuber shì ____。','My favorite YouTuber is ____.'],

recommend:['Wǒ huì tuījiàn ____ gěi péngyou, yīnwèi ____。','I would recommend ____ to my friends because ____.']
};
const groups=[
{title:'👋 1. 开场',color:'#e45192',fields:[['name','大家好！我叫＿＿＿＿。','你的名字']]},
{title:'📹 我喜欢的 YouTuber',color:'#f18a35',fields:[['creator','我最喜欢的 YouTuber 是＿＿＿＿。','YouTuber 的名字'],['topic','他／她常常拍＿＿＿＿的影片。','例如：做饭、游戏、画画'],['reason','我喜欢他／她，因为＿＿＿＿。','说说你的原因']]},
{title:'💚 3. 最喜欢的影片',color:'#76ba41',fields:[['video','我最喜欢的一部影片是＿＿＿＿。','影片的名字'],['event','这部影片里，＿＿＿＿。','影片里发生了什么事？'],['feeling','我看的时候觉得很＿＿＿＿，因为＿＿＿＿。',['例如：开心、有趣','为什么有这种感觉？'],'feelingReason'],['learned','我从影片里学到了＿＿＿＿。','你学到了什么？']]},
{title:'🎤 4. 一起拍影片',color:'#46a1df',fields:[['make','如果我可以和他／她一起拍影片，我想拍＿＿＿＿，因为＿＿＿＿。',['你想拍什么？','为什么？'],'makeReason']]},
{title:'👫 5. 和同学比一比',color:'#9671d1',fields:[['friend','我的同学＿＿＿＿最喜欢的 YouTuber 是＿＿＿＿。',['同学的名字','同学喜欢的 YouTuber'],'other'],['same','他们的影片都＿＿＿＿。','一样的地方'],['different','不一样的是，我喜欢的 YouTuber ＿＿＿＿，同学喜欢的 YouTuber ＿＿＿＿。',['我喜欢的 YouTuber……','同学喜欢的 YouTuber……'],'otherDifferent']]},
{title:'⭐ 6. 我的选择与推荐',color:'#dca52f',fields:[]}
];
const form=document.querySelector('#form');const values={};let storageOK=true;try{Object.assign(values,JSON.parse(localStorage.getItem('youtuber-writing-v1')||'{}'))}catch(e){storageOK=false}
function field(f,parent){const [id,prompt,hint,id2]=f;const wrap=document.createElement('div');const row=document.createElement('div');row.className='row';const label=document.createElement('label');label.htmlFor=id;label.textContent=prompt;const b=document.createElement('button');b.type='button';b.className='listen';b.textContent='🔊';b.setAttribute('aria-label','朗读：'+prompt);b.onclick=()=>speak(sentence(f));row.append(label,b);wrap.append(row);const help=document.createElement('div');help.className='help';const support=guides[id];if(support){const py=document.createElement('div');py.className='pinyin';py.textContent=support[0];const en=document.createElement('div');en.className='english';en.textContent=support[1];help.append(py,en);wrap.append(help)}[id,...(id2?[id2]:[])].forEach((key,i)=>{const input=document.createElement('input');input.id=key;input.dataset.answer='true';input.placeholder=Array.isArray(hint)?hint[i]:hint;input.setAttribute('aria-label',input.placeholder);input.value=values[key]||'';input.addEventListener('input',()=>{values[key]=input.value;update()});wrap.append(input)});parent.append(wrap)}
function val(id){return (values[id]||'').trim().replace(/[。！？!?，,；;]+$/u,'')||'＿＿＿＿'}
function sentence(f){let s=f[1];s=s.replace('＿＿＿＿',()=>val(f[0]));if(f[3])s=s.replace('＿＿＿＿',()=>val(f[3]));return s}
groups.forEach(g=>{const section=document.createElement('section');section.style.setProperty('--color',g.color);const h=document.createElement('h2');h.textContent=g.title;section.append(h);g.fields.forEach(f=>field(f,section));form.append(section)});
const last=form.lastElementChild;const choose=document.createElement('label');choose.textContent='选一个，说一说：';choose.htmlFor='choice';const select=document.createElement('select');select.id='choice';select.innerHTML='<option value="one">更喜欢一位</option><option value="both">两位都喜欢</option>';select.value=values.choice==='both'?'both':'one';select.onchange=()=>{values.choice=select.value;update()};last.append(choose,select);
const one=document.createElement('div'),both=document.createElement('div');last.append(one,both);field(['prefer','我更喜欢＿＿＿＿，因为＿＿＿＿。',['YouTuber 的名字','为什么？'],'preferReason'],one);field(['bothA','两位我都喜欢！我喜欢＿＿＿＿，因为＿＿＿＿；',['第一位 YouTuber','为什么喜欢？'],'bothReasonA'],both);field(['bothB','也喜欢＿＿＿＿，因为＿＿＿＿。',['另一位 YouTuber','为什么喜欢？'],'bothReasonB'],both);field(['recommend','我会推荐＿＿＿＿给朋友，因为＿＿＿＿。',['可以写一位或两位','推荐的原因'],'recommendReason'],last);
let essay='';function update(){one.hidden=select.value!=='one';both.hidden=select.value!=='both';const paragraphs=groups.slice(0,5).map(g=>g.fields.map(sentence).join(''));paragraphs.push(select.value==='both'?'两位我都喜欢！我喜欢'+val('bothA')+'，因为'+val('bothReasonA')+'；也喜欢'+val('bothB')+'，因为'+val('bothReasonB')+'。':'我更喜欢'+val('prefer')+'，因为'+val('preferReason')+'。');paragraphs.push('我会推荐'+val('recommend')+'给朋友，因为'+val('recommendReason')+'。');paragraphs.push('谢谢大家！');essay=paragraphs.join('\n\n');document.querySelector('#essay').textContent=essay;const active=[...document.querySelectorAll('[data-answer]')].filter(e=>!e.parentElement.closest('[hidden]'));document.querySelector('#progress').textContent='已填写 '+active.filter(e=>e.value.trim()).length+' / '+active.length+' 项';try{localStorage.setItem('youtuber-writing-v1',JSON.stringify(values))}catch(e){storageOK=false}if(!storageOK)status('Browser saving is unavailable. Download your essay to keep it.');}
function status(s){document.querySelector('#status').textContent=s}let sequence=0;function stop(){sequence++;if('speechSynthesis'in window)speechSynthesis.cancel()}
function speak(text){stop();if(!('speechSynthesis'in window)){status('Audio is not supported in this browser. Try Chrome, Edge, or Safari.');return}const token=sequence;const chunks=text.replaceAll('＿＿＿＿','，').split(/(?<=[。！？；])|\n+/u).filter(s=>s.trim());const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/zh[-_]CN/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));let i=0;function next(){if(token!==sequence)return;if(i===chunks.length){status('朗读完成。');return}const u=new SpeechSynthesisUtterance(chunks[i++]);u.lang='zh-CN';if(voice)u.voice=voice;u.rate=Number(document.querySelector('#speed').value);u.onend=next;u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')status('Audio could not play. Check your device’s Chinese voice settings.')};speechSynthesis.speak(u)}status('正在朗读……');next()}
let submitPending=false;
document.querySelector('#submitForm').onclick=()=>{
if(submitPending)return;
if(!(values.name||'').trim()){status('Please enter your name first. 请先填写姓名。');document.getElementById('name').focus();return}
const button=document.getElementById('submitForm');
const frame=document.createElement('iframe');frame.name='essay_submission_'+Date.now();frame.hidden=true;frame.setAttribute('title','Essay submission');
const post=document.createElement('form');post.method='POST';post.action='https://docs.google.com/forms/d/e/1FAIpQLSfoI47KZU3yOSvaHXZx0qsLmoMQOmX4uSMcg8r1mGk0CQ9XhQ/formResponse';post.target=frame.name;post.hidden=true;
for(const [key,value] of [['entry.999333436',values.name.trim()],['entry.1149432143',essay]]){const input=document.createElement('input');input.type='hidden';input.name=key;input.value=value;post.append(input)}
submitPending=true;button.disabled=true;button.textContent='Sending…';status('Sending your essay… 正在发送作文……');
document.body.append(frame,post);
try{post.submit();setTimeout(()=>{status('Essay sent. 作文已发送。此页面无法确认 Google 表单是否已接收；如需确认，请联系老师。');button.textContent='Send again';button.disabled=false;submitPending=false;post.remove();frame.remove()},15000)}catch(e){status('Could not send. Please check your connection and try again.');button.disabled=false;button.textContent='Submit essay';submitPending=false;post.remove();frame.remove()}
};
document.querySelector('#readAll').onclick=()=>speak(essay);document.querySelector('#stop').onclick=()=>{stop();status('已停止朗读。')};document.querySelector('#print').onclick=()=>{stop();window.print()};document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(essay);status('作文已复制。')}catch(e){const range=document.createRange();range.selectNodeContents(document.querySelector('#essay'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);status('Essay selected. Press Ctrl+C or Command+C to copy.')}};document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob(['我最喜欢的 YouTuber\n\n'+essay],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='My_YouTuber_Essay.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.querySelector('#clear').onclick=()=>{if(!confirm('Clear all your answers? 清除所有答案？'))return;stop();Object.keys(values).forEach(k=>delete values[k]);document.querySelectorAll('[data-answer]').forEach(e=>e.value='');select.value='one';update();status('答案已清除。')};window.addEventListener('pagehide',stop);
const supportKey='youtuber-writing-support-v1';let prefs={};try{prefs=JSON.parse(localStorage.getItem(supportKey)||'{}')}catch(e){}function toggleSupport(){document.body.classList.toggle('with-english',document.querySelector('#showEnglish').checked);document.body.classList.toggle('with-pinyin',document.querySelector('#showPinyin').checked);try{localStorage.setItem(supportKey,JSON.stringify({english:document.querySelector('#showEnglish').checked,pinyin:document.querySelector('#showPinyin').checked}))}catch(e){}}
for(const [id,key] of [['showEnglish','english'],['showPinyin','pinyin']]){document.getElementById(id).checked=!!prefs[key];document.getElementById(id).addEventListener('change',toggleSupport)}toggleSupport();update();
</script></html>
